<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChocoArte - Onde o Chocolate se Torna Arte</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <nav class="main-nav">
            <ul>
                <li><a href="#">Cardápio</a></li>
                <li><a href="#">Quem Somos</a></li>
                <li><a href="#">Como Funciona</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
            <div class="header-icons">
                <a href="#"><i class="fas fa-shopping-cart"></i></a>
                <a href="#"><i class="fas fa-user-circle"></i></a>
            </div>
        </nav>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <img src="https://i.imgur.com/your-logo-image-id.png" alt="Logo ChocoArte" class="logo">
            <h1 class="slogan">Onde o Chocolate se Torna Arte</h1>
            <div class="search-bar">
                <input type="text" placeholder="Busque seu doce favorito...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="background-elements">
            <img src="https://i.imgur.com/your-strawberry-left-image-id.png" alt="Morango decoração" class="strawberry-left">
            <img src="https://i.imgur.com/your-strawberry-right-image-id.png" alt="Morango decoração" class="strawberry-right">
        </div>
    </main>

</body>
</html>
